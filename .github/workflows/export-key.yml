name: Export Developer Key

on:
  workflow_dispatch:

jobs:
  export-key:
    runs-on: ubuntu-latest
    environment: key
    steps:
      - name: Decode and save key
        run: |
          echo "${{ secrets.GARMIN_DEVELOPER_KEY_BASE64 }}" | base64 -d > developer_key

      - name: Upload key as artifact
        uses: actions/upload-artifact@v4
        with:
          name: developer_key
          path: developer_key
          retention-days: 1

